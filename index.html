<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ops Intelligence Status</title>
<style>
:root{--bg:#0b1020;--card:#131a2c;--line:#232d48;--tx:#e8ecf5;--mut:#8592b0;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,Inter,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#0d1325;flex-wrap:wrap}
h1{font-size:17px;margin:0}.sp{flex:1}.mut{color:var(--mut)}
.pill{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.on,.PRESENT,.Proper{background:#0b3b2c;color:var(--ok)}.off,.Damaged{background:#4a1616;color:var(--bad)}.MOVED,.Checking{background:#4a3a0a;color:var(--warn)}.REMOVED{background:#2a2f40;color:#aab3c9}
#banner{display:none;margin:14px 20px 0;background:#4a1616;border:1px solid #7f2a2a;color:#fecaca;border-radius:8px;padding:10px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 20px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 14px}
.kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.kpi b{display:block;font-size:26px}
main{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;padding:14px 20px 28px}
@media(max-width:800px){main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}th{border:0;color:var(--mut);font-size:11px}
.chip{font-size:11px;background:#0f1626;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mut);margin-right:4px}
</style></head><body>
<header><h1>Real-Time Operations Intelligence</h1><span class="mut">status feed</span><span class="sp"></span>
<span id="cam" class="pill off">CAMERA OFFLINE</span><span class="mut" id="age"></span></header>
<div id="banner"></div>
<div class="kpis">
 <div class="kpi" style="--c:var(--ok)"><span>Objects present</span><b id="kP">–</b></div>
 <div class="kpi" style="--c:var(--warn)"><span>Moved</span><b id="kM">–</b></div>
 <div class="kpi" style="--c:#8592b0"><span>Taken</span><b id="kR">–</b></div>
 <div class="kpi" style="--c:var(--bad)"><span>Damaged</span><b id="kD">–</b></div>
</div>
<main>
 <section class="card"><h2>Counts by type</h2><div id="counts" class="mut">No data yet</div></section>
 <section class="card"><h2>Recent items (last 15)</h2><div id="recent" class="mut">No data yet</div></section>
</main>
<script>
const URL_='https://raw.githubusercontent.com/gdncomm-aditya-kanoi/ops-intelligence-status/data/status.json';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STALE_SEC=150;
function ago(sec){return sec<60?Math.round(sec)+'s ago':sec<3600?Math.round(sec/60)+' min ago':Math.round(sec/3600)+' h ago'}
async function load(){
 try{
  const r=await fetch(URL_+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error(r.status);
  const s=await r.json();
  const age=(Date.now()-new Date(s.updated_at).getTime())/1000;
  const online=s.camera_online&&age<STALE_SEC;
  $('cam').className='pill '+(online?'on':'off');$('cam').textContent=online?'CAMERA ONLINE':'CAMERA OFFLINE';
  $('age').textContent='updated '+ago(age);
  $('banner').style.display=online?'none':'block';
  $('banner').textContent=s.camera_online?'No update received for over '+STALE_SEC+' s - the app may have stopped. Showing last known data ('+ago(age)+').':'Camera is offline. Showing last known data ('+ago(age)+').';
  $('kP').textContent=s.kpi.present;$('kM').textContent=s.kpi.moved;$('kR').textContent=s.kpi.removed;$('kD').textContent=s.kpi.damaged;
  const types=[...new Set([...Object.keys(s.counts),...Object.keys(s.totals.in),...Object.keys(s.totals.out)])];
  $('counts').innerHTML=types.length?'<table><tr><th>Type</th><th>Now</th><th>Arrived</th><th>Taken</th></tr>'+types.map(t=>`<tr><td>${esc(t)}</td><td><b>${s.counts[t]||0}</b></td><td>${s.totals.in[t]||0}</td><td>${s.totals.out[t]||0}</td></tr>`).join('')+'</table>':'Nothing counted yet';
  $('recent').innerHTML=s.recent.length?'<table><tr><th>Item</th><th>Status</th><th>Condition</th><th>Seen</th></tr>'+s.recent.map(i=>`<tr><td><b>${esc(i.name)}</b><br><span class="chip">${esc(i.kind)}</span><span class="chip">${esc(i.label)}</span>${i.text.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</td><td><span class="pill ${i.status}">${i.status==='REMOVED'?'TAKEN':i.status==='MOVED'?'MOVED':'IN PLACE'}</span></td><td><span class="pill ${i.condition}">${i.condition.toUpperCase()}</span></td><td class="mut">${esc(i.seen)}</td></tr>`).join('')+'</table>':'No items yet';
 }catch(e){
  $('cam').className='pill off';$('cam').textContent='NO DATA';
  $('banner').style.display='block';$('banner').textContent='No status published yet, or the feed is unreachable.';
 }
}
load();setInterval(load,10000);
</script></body></html>
